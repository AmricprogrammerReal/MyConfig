[window]
padding = { x = 0, y = 0 }
dynamic_padding = false
#decorations = "none"
opacity=0.8
[font]
size = 14

[font.normal]
family = "Iosevka Charon Mono"
#family = "Terminus"
style = "Light"

[font.offset]
x = 0
y = -2

[font.glyph_offset]
x = 0
y = 0
[cursor]
# Options: Block, Underline, Beam
style = { shape = "Block", blinking = "On" }
